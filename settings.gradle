pluginManagement {
	repositories {
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.neoforged.moddev' version "${moddev_version}"
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	kotlinController = false
	
	create(getRootProject()) {
		['1.21.1', '1.21.11', '26.2', '26.3'].each { mc ->
			versions([("${mc}-neoforge".toString()): mc]).buildscript('build.neoforge.gradle')
		}
		vcsVersion = '1.21.1-neoforge'
	}
}

rootProject.name = 'dupe-patches'
